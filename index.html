<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>DEXU Music Player</title>
<link rel="manifest" href="manifest.json">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
html{height:100%;height:100dvh}
body{background:#05111F;color:#fff;font-family:'JetBrains Mono',monospace;height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(600px 500px at 50% 0%, rgba(0,200,255,0.22), transparent 60%), radial-gradient(500px 400px at 20% 80%, rgba(0,255,180,0.15), transparent 60%);pointer-events:none;z-index:0}
.header{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:calc(6px + env(safe-area-inset-top)) 16px 6px 16px;flex-shrink:0}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(22px,6.5vw,30px);letter-spacing:1px}
.btn-add{border:0;padding:6px 10px;border-radius:9px;background:linear-gradient(135deg, #00B2FF, #00FFDD);color:#00111A;font-weight:800;font-size:clamp(8px,2.4vw,10px);box-shadow:0 0 12px rgba(0,200,255,0.25);cursor:pointer}
.main{position:relative;z-index:1;padding:0 16px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;margin-top:2px}
.orb-main-row{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:clamp(90px,22vw,110px);margin-bottom:2px}
.orb{width:clamp(100px,28vw,135px);height:clamp(100px,28vw,135px);border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(60px 38px at 30% 28%, rgba(255,255,255,0.28), transparent 60%), radial-gradient(circle at center, rgba(0,160,220,0.16) 0%, rgba(5,25,50,0.45) 40%, rgba(2,8,18,0.96) 75%);border:1px solid rgba(0,255,220,0.45);box-shadow:inset 0 1px 0 rgba(255,255,255,0.22), inset 0 8px 18px rgba(0,255,220,0.18), 0 0 0 1px rgba(0,255,220,0.28), 0 0 22px rgba(0,220,255,0.35), 0 0 42px rgba(0,255,180,0.18)}
.orb-dx{font-family:'Space Grotesk',sans-serif;font-size:clamp(26px,7.5vw,36px);font-weight:700;color:transparent;-webkit-text-stroke:1.6px rgba(255,255,255,0.95);text-shadow:0 0 6px rgba(255,255,255,0.7), 0 0 12px rgba(0,200,255,0.6)}
.now-playing{text-align:center;margin:4px 0 0 0;width:100%;padding-top:2px;position:relative;z-index:1}
#nowTitle{font-size:clamp(12px,3.2vw,14px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowArtist{font-size:clamp(9px,2.6vw,10px);color:rgba(0,220,255,0.5);margin-top:2px}
.progress{width:calc(100% - 32px);margin:8px 16px 0 16px;padding:0;height:36px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:20;box-sizing:border-box}
.progress-bar{width:100%;height:36px;background:transparent;border-radius:10px;position:relative;cursor:pointer;display:flex;align-items:center;margin:0 auto;touch-action:pan-x}
.progress-bar::before{content:'';position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:4px;background:rgba(0,180,255,0.18);border-radius:10px;pointer-events:none}
.progress-fill{height:4px;background:linear-gradient(90deg, #00A8FF, #00FFDD);border-radius:10px;width:0%;position:absolute;left:0;top:50%;transform:translateY(-50%);box-shadow:0 0 6px rgba(0,255,200,0.4);pointer-events:none;z-index:1}
.progress-fill::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:12px;height:12px;background:#fff;border-radius:50%;border:1.5px solid #00E5CC;box-shadow:0 0 6px #00E5CC;z-index:2}
.time-row{display:flex;justify-content:space-between;font-size:clamp(10px,2.8vw,11px);color:rgba(0,200,255,0.6);margin-top:4px;font-weight:700;padding:0 2px;width:100%}
.controls{display:flex;justify-content:center;align-items:center;gap:clamp(14px,5vw,24px);margin:8px 0 0 0}
.ctrl-btn{font-family: Calibri, "Segoe UI", sans-serif; background:none;border:0;color:rgba(0,200,255,0.6);font-size:clamp(16px,4.5vw,19px);cursor:pointer;width:clamp(32px,8vw,38px);height:clamp(32px,8vw,38px);display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.ctrl-btn.play{width:clamp(48px,11vw,54px);height:clamp(48px,11vw,54px);border-radius:50%;background:linear-gradient(135deg, #00B2FF, #00FFDD);color:#00111A;box-shadow:0 0 12px rgba(0,200,255,0.4);font-size:clamp(16px,4.5vw,18px);font-weight:800}
.ctrl-btn.active{color:#00FFDD;text-shadow:0 0 8px #00FFDD}
.search-wrap{position:relative;z-index:1;margin:10px 16px 0 16px;flex-shrink:0}
.search-input{width:100%;padding:10px 12px 10px 38px;border-radius:10px;border:1px solid rgba(0,220,255,0.32);background:rgba(5,20,40,0.6);color:#fff;font-family:'JetBrains Mono',monospace;font-size:clamp(10px,3vw,12px);outline:none}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#00D4FF;font-size:14px}
.queue{position:relative;z-index:1;margin-top:8px;padding:0 16px calc(8px + env(safe-area-inset-bottom)) 16px;flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.queue-head{display:flex;justify-content:space-between;align-items:center;font-size:clamp(10px,2.8vw,11px);color:#00D4FF;margin-bottom:6px;font-weight:700;flex-shrink:0}
.queue-actions{display:flex;gap:4px}
.q-btn{border:1px solid rgba(0,220,255,0.22);background:rgba(0,120,255,0.08);color:#fff;padding:4px 10px;border-radius:7px;font-size:8.5px;font-weight:700;cursor:pointer;font-family:'JetBrains Mono',monospace;min-width:42px;height:24px;display:inline-flex;align-items:center;justify-content:center}
.queue-list{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.queue-list::-webkit-scrollbar{width:2px}
.queue-list::-webkit-scrollbar-thumb{background:linear-gradient(#00B2FF, #00FFDD);border-radius:2px}
.track{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(0,180,255,0.08);cursor:pointer;gap:8px}
.track-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.checkbox{width:18px;height:18px;border:1.2px solid rgba(0,200,255,0.3);border-radius:4px;display:none;align-items:center;justify-content:center;flex-shrink:0;background:rgba(0,200,255,0.04)}
.checkbox.show{display:flex}
.checkbox.checked{background:linear-gradient(135deg, #00B2FF, #00FFDD);border-color:transparent;color:#00111A;font-size:10px;font-weight:800}
.track-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:clamp(15px,4.2vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;color:rgba(255,255,255,0.92);line-height:1.3}
.track-name span{color:rgba(0,220,255,0.35);font-weight:400;font-size:0.8em}
.track.active .track-name{color:#00FFDD}
.empty{text-align:center;padding:24px 16px;color:rgba(0,200,255,0.3);font-size:12px;line-height:1.6}
.selection-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(2,8,16,0.98);border-top:1px solid rgba(0,200,255,0.2);padding:10px 16px calc(12px + env(safe-area-inset-bottom)) 16px;display:none;justify-content:space-between;align-items:center;z-index:30;gap:8px}
.selection-bar.show{display:flex}
.sel-count{font-size:11px;color:#00E5CC;font-weight:700;flex-shrink:0}
.sel-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn-cancel{border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff;padding:8px 12px;border-radius:8px;font-size:9px;font-weight:700;cursor:pointer;min-width:52px;height:28px}
.btn-delete{border:0;background:rgba(255,80,120,0.18);border:1px solid rgba(255,80,120,0.35);color:#ff7eb0;padding:8px 12px;border-radius:8px;font-size:9px;font-weight:800;cursor:pointer;min-width:52px;height:28px}
.btn-all{border:1px solid rgba(0,220,255,0.3);background:rgba(0,120,255,0.12);color:#00E5CC;padding:8px 12px;border-radius:8px;font-size:9px;font-weight:800;cursor:pointer;min-width:52px;height:28px}
.btn-rename{border:0;background:linear-gradient(135deg, #00B2FF, #00FFDD);color:#00111A;padding:8px 12px;border-radius:8px;font-size:9px;font-weight:800;cursor:pointer;min-width:52px;height:28px}



</style>
<body>
<div class="header">
  <div class="logo">DEXU</div>
  <button class="btn-add" id="addBtn">+ ADD MUSIC</button>
</div>

<div class="main">
  <div class="orb-main-row" id="orbMainRow">
    <div class="orb-center-wrap" id="orbCenterWrap">
      <div class="orb"><span class="orb-dx">DX</span></div>
    </div>
  </div>
  <div class="now-playing">
    <div id="nowTitle">NO TRACK</div>
    <div id="nowArtist">TAP + ADD MUSIC</div>
    <div id="playStatus" style="margin-top:4px;min-height:14px;display:flex;gap:8px;justify-content:center;align-items:center;font-size:9px;font-weight:700;letter-spacing:0.3px"></div>
  </div>
  <div class="progress">
    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="time-row"><span id="currTime">0:00</span><span id="totalTime">0:00</span></div>
  </div>
  <div class="controls">
    <button class="ctrl-btn" id="repeatBtn">↻</button>
    <button class="ctrl-btn" id="prevBtn">◀◀</button>
    <button class="ctrl-btn play" id="playBtn">▶</button>
    <button class="ctrl-btn" id="nextBtn">▶▶</button>
    <button class="ctrl-btn" id="shuffleBtn">⤮</button>
  </div>
</div>

<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input type="text" class="search-input" id="searchInput" placeholder="Search songs...">
</div>

<div class="queue">
  <div class="queue-head">
    <span>Queue • <span id="queueCount">0 tracks</span></span>
    <div class="queue-actions">
      <button class="q-btn" id="selectBtn">SELECT</button>
    </div>
  </div>
  <div class="queue-list" id="queueList"><div class="empty">NO MUSIC YET<br>TAP + ADD MUSIC</div></div>
</div>

<div class="selection-bar" id="selectionBar">
  <span class="sel-count" id="selCount">0 selected</span>
  <div class="sel-actions">
    <button class="btn-all" id="selectAllBtn">ALL</button>
    <button class="btn-rename" id="renameBtn" style="display:none">RENAME</button>
    <button class="btn-delete" id="deleteBtn">DEL (0)</button>
    <button class="btn-cancel" id="cancelSelBtn">CANCEL</button>
  </div>
</div>

<audio id="audioPlayer" preload="auto" playsinline></audio>

<script>
// === DEXU CLEAN CORE - No unused code ===
const audio=document.getElementById('audioPlayer');
const addBtn=document.getElementById('addBtn');
const queueList=document.getElementById('queueList');
const nowTitle=document.getElementById('nowTitle');
const nowArtist=document.getElementById('nowArtist');
const playBtn=document.getElementById('playBtn');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const repeatBtn=document.getElementById('repeatBtn');
const shuffleBtn=document.getElementById('shuffleBtn');
const progressBar=document.getElementById('progressBar');
const progressFill=document.getElementById('progressFill');
const currTimeEl=document.getElementById('currTime');
const totalTimeEl=document.getElementById('totalTime');
const queueCount=document.getElementById('queueCount');
const searchInput=document.getElementById('searchInput');
const selectBtn=document.getElementById('selectBtn');
const selectAllBtn=document.getElementById('selectAllBtn');
const deleteBtn=document.getElementById('deleteBtn');
const renameBtn=document.getElementById('renameBtn');
const selectionBar=document.getElementById('selectionBar');
const selCount=document.getElementById('selCount');
const cancelSelBtn=document.getElementById('cancelSelBtn');

let tracks=[], filteredTracks=[], currentIndex=-1, isPlaying=false, isDragging=false, searchQuery='', isSelectMode=false, selectedIds=new Set();
let isShuffle=false, isRepeat=false, shuffleHistory=[], playedSet=new Set();

const DB_NAME='DexuMusicDB',DB_VERSION=1,STORE_NAME='tracks';
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onerror=()=>rej(r.error);r.onsuccess=()=>res(r.result);r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME,{keyPath:'id',autoIncrement:true});};});}
async function saveTrackToDB(file){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE_NAME,'readwrite');const req=tx.objectStore(STORE_NAME).add({name:file.name,file:file,size:file.size,date:Date.now()});req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);});}
async function getAllTracksFromDB(){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE_NAME,'readonly');const req=tx.objectStore(STORE_NAME).getAll();req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);});}
async function deleteTrackFromDB(id){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(STORE_NAME,'readwrite');const req=tx.objectStore(STORE_NAME).delete(id);req.onsuccess=()=>res();req.onerror=()=>rej(req.error);});}
async function loadSavedTracks(){try{const saved=await getAllTracksFromDB();for(const item of saved){const url=URL.createObjectURL(item.file);tracks.push({id:item.id,file:item.file,url:url,name:item.name.replace(/\.[^/.]+$/,''),size:item.size});}filteredTracks=[...tracks];if(tracks.length>0){renderQueue();nowArtist.textContent=tracks.length+' TRACKS SAVED';queueCount.textContent=tracks.length+' tracks';}}catch(e){}}
loadSavedTracks();

function formatTime(s){if(isNaN(s)||!isFinite(s)) return '0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+String(sec).padStart(2,'0');}

// Search
searchInput.addEventListener('input', e=>{searchQuery=e.target.value.toLowerCase();filteredTracks = searchQuery==='' ? [...tracks] : tracks.filter(t=>t.name.toLowerCase().includes(searchQuery));renderQueue();});

// Select mode - ONLY SELECT outside, ALL/RENAME/DEL inside
selectBtn.addEventListener('click', ()=>{
  isSelectMode=!isSelectMode;
  selectedIds.clear();
  if(isSelectMode){
    selectBtn.textContent='CANCEL';
    selectionBar.classList.add('show');
  }else{
    selectBtn.textContent='SELECT';
    selectionBar.classList.remove('show');
  }
  renderQueue();
  updateSelectionUI();
});
cancelSelBtn.addEventListener('click', ()=>{
  isSelectMode=false;
  selectedIds.clear();
  selectBtn.textContent='SELECT';
  selectionBar.classList.remove('show');
  renderQueue();
});

selectAllBtn.addEventListener('click', ()=>{
  const list = searchQuery ? filteredTracks : tracks;
  if(selectedIds.size===list.length) selectedIds.clear();
  else list.forEach(t=>selectedIds.add(t.id));
  renderQueue();
  updateSelectionUI();
});

renameBtn.addEventListener('click', ()=>{
  if(selectedIds.size!==1) return;
  const id=[...selectedIds][0];
  const track=tracks.find(t=>t.id===id);
  if(!track) return;
  const newName=prompt('RENAME:', track.name);
  if(newName && newName.trim() && newName.trim()!==track.name){
    track.name=newName.trim();
    renderQueue();
    if(currentIndex!==-1 && tracks[currentIndex] && tracks[currentIndex].id===id) nowTitle.textContent=newName.trim();
  }
});

deleteBtn.addEventListener('click', async ()=>{
  if(selectedIds.size===0) return;
  if(!confirm('Delete '+selectedIds.size+' songs?')) return;
  const ids=[...selectedIds];
  for(const id of ids){
    const idx=tracks.findIndex(t=>t.id===id);
    if(idx!==-1){
      try{await deleteTrackFromDB(id);URL.revokeObjectURL(tracks[idx].url);tracks.splice(idx,1);if(idx===currentIndex){audio.pause();audio.src='';isPlaying=false;playBtn.textContent='▶';currentIndex=-1;nowTitle.textContent='NO TRACK';}else if(idx<currentIndex) currentIndex--;}catch(e){}
    }
  }
  selectedIds.clear();
  filteredTracks = searchQuery==='' ? [...tracks] : tracks.filter(t=>t.name.toLowerCase().includes(searchQuery));
  isSelectMode=false;
  selectBtn.textContent='SELECT';
  selectionBar.classList.remove('show');
  renderQueue();
  queueCount.textContent=tracks.length+' tracks';
});

function updateSelectionUI(){
  const count=selectedIds.size;
  selCount.textContent=count+' selected';
  deleteBtn.textContent='DEL ('+count+')';
  selectAllBtn.textContent = count>0 && count=== (searchQuery ? filteredTracks.length : tracks.length) ? 'NONE' : 'ALL';
  if(count===1) renameBtn.style.display='flex';
  else renameBtn.style.display='none';
}

// File input - audio only + drag & drop
let fileInput=null, folderInput=null;
function createFileInputs(){
  fileInput=document.createElement('input');
  fileInput.type='file';
  fileInput.multiple=true;
  fileInput.accept='audio/*,.mp3,.flac,.wav,.m4a,.ogg,.aac,.wma,.opus';
  fileInput.style.display='none';
  document.body.appendChild(fileInput);
  fileInput.onchange=e=>{
    const files=Array.from(e.target.files).filter(f=>f.type.startsWith('audio/')||/\.(mp3|flac|wav|m4a|ogg|aac|wma|opus|mp4|3gp)$/i.test(f.name));
    if(files.length>0) addTracks(files);
    fileInput.value='';
  };
  folderInput=document.createElement('input');
  folderInput.type='file';
  folderInput.multiple=true;
  folderInput.accept='audio/*';
  folderInput.setAttribute('webkitdirectory','');
  folderInput.style.display='none';
  document.body.appendChild(folderInput);
  folderInput.onchange=e=>{
    const files=Array.from(e.target.files).filter(f=>/\.(mp3|flac|wav|m4a|ogg|aac|wma|opus)$/i.test(f.name));
    if(files.length>0) addTracks(files);
    folderInput.value='';
  };
  document.body.addEventListener('dragover', e=>{e.preventDefault();});
  document.body.addEventListener('drop', e=>{
    e.preventDefault();
    const files=Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('audio/')||/\.(mp3|flac|wav|m4a|ogg|aac|wma|opus)$/i.test(f.name));
    if(files.length>0) addTracks(files);
  });
}createFileInputs();

addBtn.addEventListener('click', ()=>{fileInput.click();});
let longPressTimer;
addBtn.addEventListener('touchstart', ()=>{longPressTimer=setTimeout(()=>{if(confirm('Add entire folder?')) folderInput.click();},800);}, {passive:true});
addBtn.addEventListener('touchend', ()=>clearTimeout(longPressTimer));
addBtn.addEventListener('touchmove', ()=>clearTimeout(longPressTimer));

async function addTracks(fileList){
  const files=Array.from(fileList).filter(f=>{const n=f.name.toLowerCase();return n.endsWith('.mp3')||n.endsWith('.flac')||n.endsWith('.wav')||n.endsWith('.m4a')||n.endsWith('.ogg')||n.endsWith('.aac')||n.endsWith('.wma')||f.type.startsWith('audio/')||f.type==='';});
  if(files.length===0){alert('No audio found');return;}
  addBtn.textContent='SAVING...';
  for(const file of files){
    try{const id=await saveTrackToDB(file);const url=URL.createObjectURL(file);tracks.push({id:id,file:file,url:url,name:file.name.replace(/\.[^/.]+$/,''),size:file.size});}catch(e){}
  }
  filteredTracks = searchQuery==='' ? [...tracks] : tracks.filter(t=>t.name.toLowerCase().includes(searchQuery));
  renderQueue();
  if(currentIndex===-1) playTrack(0);
  queueCount.textContent=tracks.length+' tracks';
  addBtn.textContent='✓ '+files.length+' ADDED';
  setTimeout(()=>addBtn.textContent='+ ADD MUSIC',2000);
}

function renderQueue(){
  const list = searchQuery ? filteredTracks : tracks;
  if(list.length===0){
    queueList.innerHTML = searchQuery ? '<div class="empty">NO RESULTS FOR "'+escapeHtml(searchQuery)+'"</div>' : '<div class="empty">NO MUSIC YET<br>TAP + ADD MUSIC</div>';
    return;
  }
  queueList.innerHTML=list.map((t)=>{
    const originalIndex=tracks.indexOf(t);
    const isSelected=selectedIds.has(t.id);
    const isActive=originalIndex===currentIndex;
    const parts=t.name.split(' - ');
    const title=parts[0];
    const artist=parts[1] || '';
    return '<div class="track '+(isActive?'active':'')+'" data-index="'+originalIndex+'" data-id="'+t.id+'"><div class="track-left"><div class="checkbox '+(isSelectMode?'show':'')+' '+(isSelected?'checked':'')+'">'+(isSelected?'✓':'')+'</div><div class="track-name">'+escapeHtml(title)+' '+(artist ? '<span>— '+escapeHtml(artist)+'</span>' : '')+'</div></div><div class="track-time">'+(isActive&&isPlaying&&!isSelectMode?'▶':'')+'</div></div>';
  }).join('');
  queueList.querySelectorAll('.track').forEach(el=>{
    el.addEventListener('click', ()=>{
      const idx=parseInt(el.dataset.index);
      const id=parseInt(el.dataset.id);
      if(isSelectMode){
        if(selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
        renderQueue();
        updateSelectionUI();
      }else{
        playTrack(idx);
      }
    });
  });
}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

async function playTrack(index){
  if(index<0||index>=tracks.length) return;
  currentIndex=index;
  const track=tracks[index];
  audio.src=track.url;
  shouldPlay=true;
  audio.play().then(()=>{
    isPlaying=true;
    shouldPlay=true;
    playBtn.textContent='❚❚';
    nowTitle.textContent=track.name;
    nowArtist.textContent='PLAYING';
    updateMediaSession();
    updateMediaSessionPosition();
  }).catch(e=>{console.log(e); shouldPlay=true;});
  renderQueue();
}

playBtn.addEventListener('click', ()=>{
  if(tracks.length===0) return;
  if(isPlaying){audio.pause();isPlaying=false;playBtn.textContent='▶';}
  else{
    if(currentIndex===-1) playTrack(0);
    else audio.play().then(()=>{isPlaying=true;playBtn.textContent='❚❚';});
  }
});

prevBtn.addEventListener('click', ()=>{
  if(tracks.length===0) return;
  if(isShuffle && shuffleHistory.length>0){
    const prev=shuffleHistory.pop();
    playTrack(prev);
  }else{
    playTrack(currentIndex<=0?tracks.length-1:currentIndex-1);
  }
});

nextBtn.addEventListener('click', ()=>{playNext();});
function playNext(){
  if(tracks.length===0) return;
  if(isShuffle){
    if(playedSet.size>=tracks.length) playedSet.clear();
    let idx;
    do{idx=Math.floor(Math.random()*tracks.length);}while(playedSet.has(idx) && playedSet.size<tracks.length);
    playedSet.add(idx);
    shuffleHistory.push(currentIndex);
    playTrack(idx);
  }else{
    playTrack((currentIndex+1)%tracks.length);
  }
}

shuffleBtn.addEventListener('click', ()=>{
  isShuffle=!isShuffle;
  shuffleBtn.classList.toggle('active', isShuffle);
  if(isShuffle){playedSet.clear();shuffleHistory=[];}
  updatePlayStatus();
});

repeatBtn.addEventListener('click', ()=>{
  isRepeat=!isRepeat;
  repeatBtn.classList.toggle('active', isRepeat);
  audio.loop=isRepeat;
  updatePlayStatus();
});

function updatePlayStatus(){
  const statusEl=document.getElementById('playStatus');
  if(!statusEl) return;
  let html='';
  if(isShuffle) html+='<span style="background:rgba(0,255,220,0.12);border:1px solid rgba(0,255,220,0.25);color:#00FFDD;padding:2px 6px;border-radius:5px;font-size:8px">🔀 SHUFFLE ON</span>';
  if(isRepeat) html+='<span style="background:rgba(0,180,255,0.12);border:1px solid rgba(0,180,255,0.25);color:#00B2FF;padding:2px 6px;border-radius:5px;font-size:8px">🔁 REPEAT ON</span>';
  statusEl.innerHTML=html;
}


audio.addEventListener('timeupdate', ()=>{
  if(!isDragging){
    const pct=audio.currentTime/audio.duration;
    if(!isNaN(pct)) progressFill.style.width=(pct*100)+'%';
  }
  currTimeEl.textContent=formatTime(audio.currentTime);
  if(!isNaN(audio.duration) && audio.duration>0) totalTimeEl.textContent=formatTime(audio.duration);
  updateMediaSessionPosition();
});

audio.addEventListener('loadedmetadata', ()=>{
  totalTimeEl.textContent=formatTime(audio.duration);
  currTimeEl.textContent=formatTime(0);
});

audio.addEventListener('ended', ()=>{
  if(isRepeat) audio.play();
  else playNext();
});

// Progress bar drag - fixed
progressBar.addEventListener('mousedown', e=>{
  isDragging=true;
  const r=progressBar.getBoundingClientRect();
  const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  progressFill.style.width=(p*100)+'%';
});
window.addEventListener('mousemove', e=>{
  if(!isDragging) return;
  const r=progressBar.getBoundingClientRect();
  const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  progressFill.style.width=(p*100)+'%';
});
window.addEventListener('mouseup', e=>{
  if(!isDragging) return;
  const r=progressBar.getBoundingClientRect();
  const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  if(!isNaN(audio.duration)) audio.currentTime=p*audio.duration;
  isDragging=false;
});
progressBar.addEventListener('touchstart', e=>{
  isDragging=true;
  const r=progressBar.getBoundingClientRect();
  const p=Math.max(0,Math.min(1,(e.touches[0].clientX-r.left)/r.width));
  progressFill.style.width=(p*100)+'%';
  if(!isNaN(audio.duration)) audio.currentTime=p*audio.duration;
  e.preventDefault();
}, {passive:false});
progressBar.addEventListener('touchmove', e=>{
  if(!isDragging) return;
  const r=progressBar.getBoundingClientRect();
  const p=Math.max(0,Math.min(1,(e.touches[0].clientX-r.left)/r.width));
  progressFill.style.width=(p*100)+'%';
  if(!isNaN(audio.duration)) audio.currentTime=p*audio.duration;
  e.preventDefault();
}, {passive:false});
progressBar.addEventListener('touchend', e=>{
  if(isDragging){
    const r=progressBar.getBoundingClientRect();
    const p=Math.max(0,Math.min(1,(e.changedTouches[0].clientX-r.left)/r.width));
    if(!isNaN(audio.duration)) audio.currentTime=p*audio.duration;
    isDragging=false;
  }
});
progressBar.addEventListener('click', e=>{
  const r=progressBar.getBoundingClientRect();
  const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  if(!isNaN(audio.duration)) audio.currentTime=p*audio.duration;
});

// === LOCK SCREEN FIX - Music continues when screen off ===
let shouldPlay=false;

function updateMediaSession(){
  if(!('mediaSession' in navigator)) return;
  try{
    const title = nowTitle.textContent || 'DEXU';
    const artist = tracks[currentIndex] ? tracks[currentIndex].name : 'DEXU Music Player';
    navigator.mediaSession.metadata=new MediaMetadata({
      title: title,
      artist: artist,
      album: 'DEXU Music Player',
      artwork: [
        {src:'icon-192.png', sizes:'192x192', type:'image/png'},
        {src:'icon-512.png', sizes:'512x512', type:'image/png'}
      ]
    });
    navigator.mediaSession.playbackState=isPlaying?'playing':'paused';
    if('setPositionState' in navigator.mediaSession && audio.duration){
      try{navigator.mediaSession.setPositionState({duration:audio.duration, playbackRate:1, position:audio.currentTime||0});}catch(e){}
    }
  }catch(e){}
}
function updateMediaSessionPosition(){
  if('mediaSession' in navigator && navigator.mediaSession.setPositionState && audio.duration){
    try{navigator.mediaSession.setPositionState({duration:audio.duration, playbackRate:1, position:audio.currentTime});}catch(e){}
  }
}

// Prevent pause when screen locks - CRITICAL
audio.addEventListener('pause', ()=>{
  // If page is hidden (lock screen), don't mark as shouldPlay=false - keep it true so it resumes
  if(document.hidden){
    console.log('DEXU: Pause while hidden - keeping shouldPlay true for lockscreen');
    return;
  }
  shouldPlay=false;
  isPlaying=false;
  playBtn.textContent='▶';
  updateMediaSession();
});

audio.addEventListener('play', ()=>{
  shouldPlay=true;
  isPlaying=true;
  playBtn.textContent='❚❚';
  updateMediaSession();
});

// When user returns from lock screen or app comes back, resume if it should be playing
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && shouldPlay && audio.paused && audio.src){
    console.log('DEXU: Resuming after visibility change');
    audio.play().catch(()=>{});
  }
  if(!document.hidden){
    updateMediaSession();
  }
});

// Handle interruptions - auto resume
audio.addEventListener('ended', ()=>{
  if(isRepeat) audio.play();
  else playNext();
});

if('mediaSession' in navigator){
  try{
    navigator.mediaSession.setActionHandler('play', async ()=>{
      shouldPlay=true;
      try{await audio.play(); isPlaying=true; playBtn.textContent='❚❚'; updateMediaSession();}catch(e){}
    });
    navigator.mediaSession.setActionHandler('pause', ()=>{
      shouldPlay=false;
      audio.pause();
      isPlaying=false;
      playBtn.textContent='▶';
      updateMediaSession();
    });
    navigator.mediaSession.setActionHandler('previoustrack', ()=>{prevBtn.click();});
    navigator.mediaSession.setActionHandler('nexttrack', ()=>{nextBtn.click();});
    navigator.mediaSession.setActionHandler('seekbackward', (d)=>{audio.currentTime=Math.max(0, audio.currentTime-(d.seekOffset||10));});
    navigator.mediaSession.setActionHandler('seekforward', (d)=>{audio.currentTime=Math.min(audio.duration, audio.currentTime+(d.seekOffset||10));});
    navigator.mediaSession.setActionHandler('seekto', d=>{if(d.seekTime!=null) audio.currentTime=d.seekTime; updateMediaSessionPosition();});
    console.log('DEXU: Lockscreen controls registered');
  }catch(e){console.log('MediaSession error', e);}
}


// === ONEPLUS 10R NO-SETTINGS KEEP-ALIVE ===
let keepAliveCtx=null;
let keepAliveOsc=null;
let resumeLoop=null;

function startKeepAlive(){
  try{
    if(!keepAliveCtx){
      keepAliveCtx = new (window.AudioContext||window.webkitAudioContext)();
    }
    if(keepAliveCtx.state==='suspended') keepAliveCtx.resume();
    // Ultra-light silent oscillator - just to keep audio session alive, no lag
    if(!keepAliveOsc){
      keepAliveOsc = keepAliveCtx.createOscillator();
      const gain = keepAliveCtx.createGain();
      gain.gain.value = 0.001; // inaudible
      keepAliveOsc.frequency.value = 20; // below hearing
      keepAliveOsc.connect(gain);
      gain.connect(keepAliveCtx.destination);
      keepAliveOsc.start();
    }
  }catch(e){}
}

function stopKeepAlive(){
  try{
    if(keepAliveOsc){ keepAliveOsc.stop(); keepAliveOsc.disconnect(); keepAliveOsc=null; }
  }catch(e){}
}

function startResumeLoop(){
  if(resumeLoop) clearInterval(resumeLoop);
  resumeLoop = setInterval(()=>{
    if(shouldPlay && audio.src && audio.paused){
      console.log('DEXU: OnePlus auto-resume attempt');
      audio.play().catch(()=>{});
      if(keepAliveCtx && keepAliveCtx.state==='suspended') keepAliveCtx.resume();
    }
    // Keep media session alive - update position every 2 sec so lockscreen doesn't disappear
    if(shouldPlay && isPlaying) updateMediaSessionPosition();
  }, 1000);
}

// Start keep-alive when playing
const origPlayTrack = playTrack;
audio.addEventListener('play', ()=>{
  startKeepAlive();
  startResumeLoop();
});
audio.addEventListener('pause', ()=>{
  // Don't stop keep-alive if hidden (lockscreen)
  if(!document.hidden){
    stopKeepAlive();
    if(resumeLoop){ clearInterval(resumeLoop); resumeLoop=null; }
  }
});

// OnePlus fix: When audio gets interrupted by OS, it fires 'emptied' or 'suspend' - auto resume
audio.addEventListener('suspend', ()=>{
  if(shouldPlay){
    setTimeout(()=>{ if(audio.paused) audio.play().catch(()=>{}); }, 200);
  }
});

// Prevent browser from pausing when tab hidden - force play
let hiddenPlayAttempts=0;
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden && shouldPlay){
    // We're going to lockscreen - start keep-alive
    startKeepAlive();
    hiddenPlayAttempts=0;
  } else if(!document.hidden && shouldPlay && audio.paused){
    // Came back - resume
    hiddenPlayAttempts=0;
    audio.play().catch(()=>{});
    startKeepAlive();
  }
}, {passive:true});

// Page lifecycle - OnePlus fires freeze/resume
document.addEventListener('freeze', ()=>{
  console.log('DEXU: Page frozen - keeping shouldPlay');
});
document.addEventListener('resume', ()=>{
  if(shouldPlay && audio.paused){
    audio.play().catch(()=>{});
    startKeepAlive();
  }
});

// Wake Lock - keep screen awake while playing (optional, helps some phones)
let wakeLock=null;
async function requestWakeLock(){
  if('wakeLock' in navigator){
    try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}
  }
}
audio.addEventListener('play', ()=>{requestWakeLock();});
document.addEventListener('visibilitychange', ()=>{if(wakeLock!==null && document.visibilityState==='visible'){requestWakeLock();}});
</script>
